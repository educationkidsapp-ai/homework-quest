# Local development: `docker compose up --build` starts PostgreSQL and the API together.
# Secrets come from .env (see .env.example); it is git-ignored.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-quest}
      POSTGRES_USER: ${DB_USER:-quest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quest}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quest} -d ${DB_NAME:-quest}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: local          # fake Firebase auth (Bearer fake-token-<uid>), CORS *, seeded lessons
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-quest}
      DB_USER: ${DB_USER:-quest}
      DB_PASSWORD: ${DB_PASSWORD:-quest}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quest.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-local-only-secret-please-change-me-32-bytes}
      STORAGE_KIND: local
      STORAGE_DIR: /app/data/files
    volumes:
      - files:/app/data
    ports:
      - "8080:8080"

volumes:
  pgdata:
  files:

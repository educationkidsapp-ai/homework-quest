name: Server — test, build, deploy to Cloud Run

on:
  push:
    branches: [main]
    paths: ["server/**", "shared-api/**", "shared-ui/**", "webAdmin/**", "Dockerfile", "firebase.json", "deploy/**", "gradle/**", "*.gradle.kts", ".github/workflows/deploy.yml"]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'me-central1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared contract — schema tests, publish to ~/.m2
        run: ./gradlew :shared-api:jvmTest :shared-api:publishToMavenLocal -Pquest.serverOnly=true --no-daemon
      - name: Server tests (H2 + sample LLM; PostgreSQL via Testcontainers)
        run: cd server && ./mvnw -B -q test
      - name: OpenAPI ↔ shared contract check
        run: cd server && ./mvnw -B -q test -Dtest=OpenApiContractTest -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: "server/target/surefire-reports/**" }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation (recommended). Alternatively set `credentials_json: ${{ secrets.GCP_SA_KEY }}`.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image with Cloud Build and deploy to Cloud Run
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -a; source deploy/variables.env; set +a
          ./deploy/gcloud.sh build
          ./deploy/gcloud.sh deploy
      - name: Admin panel → Firebase Hosting
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -a; source deploy/variables.env; set +a
          npm i -g firebase-tools
          ./deploy/gcloud.sh admin

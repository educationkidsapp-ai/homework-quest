name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Shared contract (schemas, scoring, map rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared-api:jvmTest :shared-api:publishToMavenLocal -Pquest.serverOnly=true --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: shared-api-m2, path: ~/.m2/repository/quest, retention-days: 1 }

  server:
    name: Server (H2 + PostgreSQL)
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/download-artifact@v4
        with: { name: shared-api-m2, path: ~/.m2/repository/quest }
      - name: Tests (parent flow, admin pipeline + cache, OpenAPI contract, Testcontainers on Postgres 16)
        run: cd server && ./mvnw -B -q test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: server-test-reports, path: server/target/surefire-reports/** }

  app:
    name: App (architecture, screenshots, Android QA APK, admin panel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared app tests (architecture rules, journey flow, 51 screenshots)
        run: ./gradlew :shared:desktopTest --no-daemon
      - name: Android QA debug APK + admin panel (Wasm)
        run: ./gradlew :androidApp:assembleQaDebug :webAdmin:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shared/build/screenshots/**, retention-days: 7 }

  dashboard:
    # Path-filtered inside the job (not with a workflow-level `paths:`) so the `ci` aggregate below always exists as a
    # status check. No Gradle/Maven setup here and no Java toolchain: this job caches pnpm only, and on a PR that does
    # not touch the dashboard every step after the filter is skipped, so it costs ~10 s of runner time.
    # Playwright (`pnpm e2e`, styleguide screenshots) is deliberately NOT part of CI: it needs browser downloads and a
    # deployed target, and runs against QA after the deploy in phase 3 (P3.x), not on every PR. The plain shell
    # scripts under e2e/ are only linted (see the `scripts` job), never run.
    name: Dashboard (lint, unit tests, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists the PR's changed files through the API instead of a deep fetch
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            dashboard:
              - 'dashboard/**'
              - 'design/tokens.json'
              - '.github/workflows/ci.yml'
      - name: Enable corepack (pnpm version comes from dashboard/package.json "packageManager")
        if: steps.changes.outputs.dashboard == 'true'
        run: |
          # --install-directory keeps the shims out of the root-owned /usr/local/bin (no sudo, survives setup-node);
          # `prepare --activate` reads the "packageManager": "pnpm@x.y.z" pin and makes that version the default, so the
          # `pnpm store path` that setup-node runs from the repo root resolves to the same pnpm as the steps below.
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          corepack prepare --activate
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
      # after corepack, so setup-node's `cache: pnpm` finds the pinned pnpm and can read the store path
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.dashboard == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install
        if: steps.changes.outputs.dashboard == 'true'
        run: corepack pnpm install --frozen-lockfile
      - name: Generated API client (openapi-generator over server/openapi.json)
        # `--if-present` because tools/gen-api.mjs is still a placeholder on develop and P3.1 turns it into the real
        # generator; there is no `postinstall`, so the client has to be generated explicitly before lint/test/build.
        if: steps.changes.outputs.dashboard == 'true'
        run: pnpm run --if-present gen:api
      - name: Design tokens must match design/tokens.json
        if: steps.changes.outputs.dashboard == 'true'
        run: pnpm tokens --check
      - name: Subset fonts must match the TTFs in shared-ui
        if: steps.changes.outputs.dashboard == 'true'
        run: node tools/fonts.mjs --check
      - name: Lint
        if: steps.changes.outputs.dashboard == 'true'
        run: pnpm lint
      - name: Unit tests (Vitest)
        if: steps.changes.outputs.dashboard == 'true'
        run: pnpm test
      - name: Build (QA configuration)
        if: steps.changes.outputs.dashboard == 'true'
        run: pnpm build --configuration=qa
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.dashboard == 'true'
        with: { name: dashboard-dist, path: dashboard/dist, retention-days: 1 }

  scripts:
    # The e2e shell scripts (e2e/isolation.sh, e2e/flags.sh, ...) run against a live server, so CI cannot execute them;
    # this catches syntax errors and shellcheck warnings before a human does. shellcheck ships on ubuntu-latest.
    name: Shell scripts (bash -n, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (bash -n takes one script; the rest would become its $1)
        run: for f in e2e/*.sh; do bash -n "$f"; done
      - name: shellcheck (warning and above; no suppressions expected)
        run: shellcheck -S warning e2e/*.sh

  ios:
    # macOS minutes are expensive: runs on PRs labelled `ios` and on every push to main.
    name: iOS (simulator build + full-cycle UI test)
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Full cycle on the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(x["udid"] for r in d["devices"].values() for x in r if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" || true
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" -only-testing:iosAppUITests/JourneyUITests CODE_SIGNING_ALLOWED=NO -quiet

  # The status check the deploy workflows and the (Pro-only) branch rules wait for.
  ci:
    name: ci
    needs: [contract, server, app, dashboard, scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "contract=${{ needs.contract.result }} server=${{ needs.server.result }} app=${{ needs.app.result }} dashboard=${{ needs.dashboard.result }} scripts=${{ needs.scripts.result }}"
          [ "${{ needs.contract.result }}" = success ] && [ "${{ needs.server.result }}" = success ] && [ "${{ needs.app.result }}" = success ] && [ "${{ needs.scripts.result }}" = success ] || exit 1
          # the dashboard job is path-filtered, so `skipped` (nothing under dashboard/ changed) counts as success
          case "${{ needs.dashboard.result }}" in success|skipped) ;; *) exit 1 ;; esac

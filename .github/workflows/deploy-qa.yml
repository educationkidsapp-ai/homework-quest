name: Deploy QA

# develop → QA project. Builds the image once (server + the Angular dashboard at /dashboard/ + the legacy webAdmin panel
# at /panel/ until P3.6), tags it with the commit SHA (production later promotes that exact digest), applies Terraform,
# deploys Cloud Run, runs Lighthouse against the dashboard, builds a QA APK, and posts the links on the merged PR.
#
# Environment variables this workflow expects (set by infra/bootstrap.sh from the Terraform outputs):
#   API_URL, ADMIN_URL, IMAGE, GCP_* … and DASHBOARD_URL (`terraform output -raw dashboard_url`, i.e. <api>/dashboard/).
#   Re-create a single one by hand with:
#     gh variable set DASHBOARD_URL --env qa --body "$(cd infra/terraform && terraform output -raw dashboard_url)"
#   Every use below falls back to "<API_URL>/dashboard/" so the workflow still works before the variable exists.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  # Keyed on the ref, never cancelled: two merges in quick succession queue, they do not race for Cloud Run or for
  # the Terraform state, and a half-applied deploy is never abandoned mid-flight.
  group: deploy-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write
  actions: read

env:
  TAG: ${{ github.sha }}

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gcp-auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Admin panel bundle (Kotlin/Wasm) → server/panel, served by the API at /panel/
        run: ./scripts/build-panel.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build and push the image (Gradle contract → Maven → dashboard (pnpm) → Temurin 21 + LibreOffice)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.IMAGE }}:${{ env.TAG }}
            ${{ vars.IMAGE }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ env.TAG }}

  infra:
    name: Terraform apply (QA)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: qa
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gcp-auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: Terraform (secret containers → your values via gcloud → everything else)
        working-directory: infra/terraform
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          terraform init -backend-config=envs/qa.backend -input=false
          terraform apply -var-file=envs/qa.tfvars -auto-approve -input=false -target=google_secret_manager_secret.s
          optional=$(../secrets.sh "${{ vars.GCP_PROJECT_ID }}" | paste -sd, - | sed 's/[^,]*/"&"/g; s/""//')
          terraform apply -var-file=envs/qa.tfvars -auto-approve -input=false -var="optional_secrets=[$optional]"

  deploy:
    name: Cloud Run + migrations
    needs: [image, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: qa
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gcp-auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: Wake the database if it was put to sleep (infra/env.sh qa sleep)
        run: ./infra/env.sh qa wake
      - name: Deploy (Flyway migrates on start; the startup probe waits for /health)
        run: |
          # the image carries APP_VERSION (Dockerfile ARG); no --update-env-vars, so Terraform's env stays the single source
          gcloud run deploy homework-quest-api --region "${{ vars.GCP_REGION }}" \
            --image "${{ vars.IMAGE }}@${{ needs.image.outputs.digest }}" --quiet
      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do curl -fsS "${{ vars.API_URL }}/health" && exit 0; sleep 6; done; exit 1

  e2e:
    # Playwright runs here, not on pull requests: browser downloads and a deployed target cost minutes on every PR
    # and prove less than one run against the environment that was actually shipped. `E2E_BASE_URL` switches
    # dashboard/playwright.config.ts from the local dev server to QA (the dashboard is served at <API>/dashboard/).
    name: Dashboard e2e (Playwright, against QA)
    needs: deploy
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      E2E_BASE_URL: ${{ vars.API_URL }}
      E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL || 'admin@quest.local' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # Seeded staff and parent accounts (e2e/seed/seed.mjs). Absent until the owner sets them on the `qa`
      # environment; the specs that need them say which variable is missing, never its value.
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_PARENT_PASSWORD: ${{ secrets.E2E_PARENT_PASSWORD }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - name: Enable corepack (pnpm version comes from dashboard/package.json "packageManager")
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          corepack prepare --activate
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Cache the browser (keyed on the lockfile, so a Playwright bump re-downloads it)
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/pnpm-lock.yaml') }}
      - name: Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Chromium system libraries (the browser itself came from the cache)
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: The QA origin and the seeded accounts must be configured
        run: |
          # An empty E2E_BASE_URL would make the config fall back to `ng serve` on this runner and test nothing that
          # was deployed, so it is an error, not a warning. The suite reads the passwords by name and never prints
          # them; this only reports which name is missing.
          [ -n "$E2E_BASE_URL" ] || { echo "::error::the qa environment has no API_URL variable — nothing to test against"; exit 1; }
          missing=
          [ -n "$E2E_ADMIN_PASSWORD" ] || missing="$missing ADMIN_PASSWORD"
          [ -n "$E2E_STAFF_PASSWORD" ] || missing="$missing E2E_STAFF_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing on the qa environment:$missing — set them with 'gh secret set <NAME> --env qa' and seed QA with e2e/seed/seed.mjs"
            exit 1
          fi
          echo "testing ${E2E_BASE_URL}/dashboard/"
      - name: Run the suite against QA
        run: pnpm e2e:qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            dashboard/playwright-report/**
            dashboard/e2e/.output/**
          retention-days: 7

  lighthouse:
    # The dashboard sign-in page is public, so Lighthouse needs no credentials. Thresholds live in
    # .github/lighthouserc.json (JSON, so it carries no comments: `categories:performance` and
    # `categories:accessibility` ≥ 0.9) and are hard gates — continue-on-error is false, a regression turns Deploy QA
    # red. Runs only after a successful deploy, so it costs nothing on a failed one.
    name: Lighthouse CI (dashboard sign-in)
    needs: deploy # skipped automatically when the deploy fails, so a broken deploy costs no Lighthouse minutes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # least privilege for the only third-party action in this workflow: no id-token (it must not be able to mint a
      # GCP WIF token for the QA deployer) and no pull-requests write — the announce job posts the scores.
      contents: read
    environment: qa
    outputs:
      performance: ${{ steps.scores.outputs.performance }}
      accessibility: ${{ steps.scores.outputs.accessibility }}
    env:
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('{0}/dashboard/', vars.API_URL) }}
    steps:
      - uses: actions/checkout@v7
      - name: Warm the URL twice (QA scales to zero; a cold start would be measured as page load time)
        run: |
          for _ in 1 2; do
            curl -fsS -o /dev/null --max-time 90 "$DASHBOARD_URL" || true
            sleep 5
          done
          curl -fsS -o /dev/null --max-time 60 "$DASHBOARD_URL"
      - name: Lighthouse (performance ≥ 90, accessibility ≥ 90)
        id: lhci
        continue-on-error: false
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ env.DASHBOARD_URL }}
          runs: 3 # lhci asserts on the median run; one run on a shared runner is too noisy for a hard 90 gate
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-dashboard-${{ github.sha }}
      - name: Scores for the PR comment
        id: scores
        if: always()
        run: |
          # The action writes .lighthouseci/manifest.json (lhci upload --target=filesystem) before it reports a failed
          # assertion, so the scores are readable whether the thresholds held or not. Never fail this step: the job's
          # verdict is the Lighthouse step's, this one only feeds the PR comment.
          s=$(jq -r '((map(select(.isRepresentativeRun)) + .)[0].summary)
                     | "\(.performance*100|round)|\(.accessibility*100|round)"' .lighthouseci/manifest.json 2>/dev/null || true)
          case "$s" in
            *"|"*) perf=${s%%|*}; a11y=${s##*|} ;;
            *)     perf=n/a;      a11y=n/a ;;
          esac
          printf 'performance=%s\naccessibility=%s\n' "$perf" "$a11y" >> "$GITHUB_OUTPUT"
          echo "Lighthouse on $DASHBOARD_URL — performance $perf, accessibility $a11y (threshold 90)" >> "$GITHUB_STEP_SUMMARY"

  apk:
    name: QA APK
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa
    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (optional — debug key when the secret is absent)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - run: ./gradlew :androidApp:assembleQaRelease -Pquest.qa.apiBaseUrl=${{ vars.API_URL }} --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: homework-quest-qa-${{ github.sha }}
          path: androidApp/build/outputs/apk/qa/release/*.apk
          retention-days: 30

  announce:
    name: Post links on the merged PR
    needs: [image, deploy, apk, lighthouse]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qa
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
            const body = [
              `🚀 **Deployed to QA** (\`${sha.slice(0, 7)}\`)`,
              `- API: ${{ vars.API_URL }}`,
              `- Dashboard: ${{ vars.DASHBOARD_URL || format('{0}/dashboard/', vars.API_URL) }}`,
              `- Admin panel (legacy webAdmin, until P3.6): ${{ vars.ADMIN_URL }}`,
              `- Lighthouse on the dashboard sign-in (threshold 90): performance **${{ needs.lighthouse.outputs.performance || 'n/a' }}**, accessibility **${{ needs.lighthouse.outputs.accessibility || 'n/a' }}** — ${{ needs.lighthouse.result }}`,
              `- QA APK: ${{ needs.apk.outputs.artifact_url || 'build failed' }}`,
              `- Image digest for promotion: \`${{ needs.image.outputs.digest }}\``,
            ].join('\n');
            for (const pr of prs.data) await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            if (!prs.data.length) core.notice(body);

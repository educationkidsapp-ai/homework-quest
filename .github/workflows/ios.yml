name: iOS

# The only workflow that uses a macOS runner, where a minute is billed as ten Linux minutes. It therefore never runs
# on a pull request: PRs type-check the common (iOS-facing) sources on Linux in `ci.yml`'s App job, and the real
# Kotlin/Native compile plus the simulator UI test run here, after the merge.
#
#   gh workflow run ios.yml --ref <branch>     # on demand, any branch, before a risky iOS change lands
on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Ten seconds of Linux to decide whether to spend ten minutes of macOS: a merge that touched only the server or
    # the dashboard cannot have broken the iOS app. Tags and manual runs always build.
    name: Does this touch the app?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      app: ${{ github.ref_type != 'branch' || github.event_name == 'workflow_dispatch' || steps.f.outputs.app == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: f
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          filters: |
            app:
              - 'iosApp/**'
              - 'shared/**'
              - 'shared-ui/**'
              - 'shared-api/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ios.yml'

  ios:
    name: iOS (simulator build + full-cycle UI test)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with:
          # macOS keeps its own cache entries (Kotlin/Native's klibs and the konan distribution are host-specific).
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Kotlin/Native compile for the simulator target
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64
      - name: Full cycle on the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(x["udid"] for r in d["devices"].values() for x in r if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" || true
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" -only-testing:iosAppUITests/JourneyUITests CODE_SIGNING_ALLOWED=NO -quiet

# `SPRING_PROFILES_ACTIVE=h2` — run without PostgreSQL (in-memory H2 in PostgreSQL mode). Development only.
spring:
  datasource:
    url: jdbc:h2:mem:quest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none

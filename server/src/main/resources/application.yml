spring:
  application.name: homework-quest
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:quest}}
    username: ${DB_USER:quest}
    password: ${DB_PASSWORD:quest}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: 25MB
    max-request-size: 120MB

server:
  port: ${PORT:8080}
  # native = Tomcat's RemoteIpValve: it resolves `getRemoteAddr()` to the rightmost hop it does not trust, so an
  # X-Forwarded-For entry a caller writes themselves cannot become the sign-in rate limit's key (AuthController.clientIp).
  forward-headers-strategy: native
  compression.enabled: true

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

quest:
  version: ${APP_VERSION:dev}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  dashboard-url: ${DASHBOARD_URL:}          # origin the dashboard is served from; blank falls back to public-url
  # The product's name is not configured here (§A): it is the `platform_settings` row seeded by V5, edited by Admin.
  panel-dir: ${PANEL_DIR:}   # legacy webAdmin bundle served at /panel/ (the Docker image sets it); retired in P3.6
  dashboard-dir: ${DASHBOARD_DIR:}   # Angular dashboard bundle served at /dashboard/ (D10); blank = 404, logged once at startup
  cors-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:5173}
  auth:
    fake: ${FAKE_AUTH:false}
    firebase-credentials: ${FIREBASE_CREDENTIALS:}
    jwt-secret: ${ADMIN_JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
    jwt-hours: 12                           # the `/admin/auth/sign-in` alias only, so `webAdmin/` keeps its session
    access-minutes: 15
    refresh-days: 30
    reset-minutes: 60
    invite-days: 7
    impersonate-minutes: 30
    sign-in-attempts: 10                    # per email + IP
    sign-in-window-minutes: 15
  mail:
    provider: ${MAIL_PROVIDER:log}          # log | resend
    api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:no-reply@localhost}
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    # USD per 1 000 tokens, used to turn `lessons.token_usage` into the Billing and Platform-cost figures. A blended
    # input+output assumption for the DeepSeek chat model, not an invoice — set it to the rate your bill uses.
    price-per-1k-tokens: ${LLM_PRICE_PER_1K_TOKENS:0.0004}
    # Hard per-call bounds on every provider. A model call that hangs is what left a QA lesson `generating` for
    # three quarters of an hour: a read timeout turns it into the transient failure the step already knows how to
    # retry. `timeout-seconds` is capped at 120 in code — the outer bound is the step deadline below.
    timeout-seconds: ${QUEST_LLM_TIMEOUT_SECONDS:120}
    connect-timeout-seconds: ${QUEST_LLM_CONNECT_TIMEOUT_SECONDS:10}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5}
    max-tokens: 16000
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
    vision-model: ${DEEPSEEK_VISION_MODEL:deepseek-flash}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:16384}
  pipeline:
    # CR4 §4: uploads are converted to Markdown before the model reads them. The two binaries come from the runtime
    # image (Dockerfile) and their paths are the same environment variables the image sets; blank falls back to PATH.
    convert:
      anydoc-bin: ${QUEST_ANYDOC_BIN:anydoc}
      tesseract-bin: ${QUEST_TESSERACT_BIN:tesseract}
      timeout-seconds: ${QUEST_CONVERT_TIMEOUT_SECONDS:120}      # per file, OCR included
      ocr-page-timeout-seconds: ${QUEST_CONVERT_OCR_PAGE_TIMEOUT_SECONDS:20}
      max-markdown-chars: ${QUEST_CONVERT_MAX_MARKDOWN_CHARS:400000}
      # Off everywhere a real deployment runs: a missing converter is an operator error, not something to paper over.
      # No environment placeholder on purpose, and `ConversionService` additionally requires an active `h2` or `test`
      # profile — so this cannot be switched on from the outside on a QA or production service, only by running a
      # profile that has no model and no bucket behind it. Those two turn it on below, so a laptop and CI (neither
      # has Node or Tesseract) still run the pipeline, extracting text with PDFBox/POI and recording method `text`.
      allow-builtin-fallback: false
    # How long one step may run before the watchdog calls it dead. Generate steps make two model calls with the
    # retries in between, analyse one, convert is local work. A step past its deadline is marked `error`/`timeout`,
    # the lesson leaves `generating`, and Retry and Delete work again.
    deadline:
      generate-seconds: ${QUEST_PIPELINE_DEADLINE_GENERATE_SECONDS:360}
      analyze-seconds: ${QUEST_PIPELINE_DEADLINE_ANALYZE_SECONDS:240}
      convert-seconds: ${QUEST_PIPELINE_DEADLINE_CONVERT_SECONDS:180}
    watchdog:
      # The sweep that recovers a job this instance never had — a Cloud Run instance recycled mid-step leaves the row
      # `running` and nothing else would ever finish it. Runs once at startup and then on this interval.
      enabled: ${QUEST_PIPELINE_WATCHDOG_ENABLED:true}
      interval-seconds: ${QUEST_PIPELINE_WATCHDOG_INTERVAL_SECONDS:60}
      # Added to a step's deadline before the sweep touches a row, so a job running on another instance is never
      # taken away from it over a clock skew.
      grace-seconds: ${QUEST_PIPELINE_WATCHDOG_GRACE_SECONDS:60}
  storage:
    kind: ${STORAGE_KIND:local}
    local-dir: ${STORAGE_DIR:data/files}
    gcs-bucket: ${GCS_BUCKET:}
  admin:
    seed-email: ${ADMIN_EMAIL:}
    seed-password: ${ADMIN_PASSWORD:}
  seed:
    # SchoolSeed: 30 classes / 40 teachers / 600 children from resources/seed/*.csv, into the default school. Off here,
    # on in `qa` and `h2`; `prod` has no such bean at all. SEED_STAFF_PASSWORD is the one password the seeded teachers
    # share (must_change_password cleared) so an e2e run can sign in as any of them; blank = per-teacher, unprintable.
    school: ${SEED_SCHOOL:false}
    # Which four files: `full` (the 30-class school the e2e suite needs) or `acceptance` (the owner's three sections,
    # two teachers and no children, resources/seed/acceptance/*.csv). An unknown name falls back to `full`.
    profile: ${SEED_PROFILE:full}
    # One-shot wipe of every school-scoped row, run once before the seed and then turned back off. Refused under `prod`.
    reset: ${SEED_RESET:false}
    # Which run of the wipe this is: blank is the original one-shot, any new value runs it again once and is recorded
    # in `seed_resets` under that name. Re-deploying with a value already there deletes nothing.
    reset-token: ${SEED_RESET_TOKEN:}
    staff-password: ${SEED_STAFF_PASSWORD:}

logging.level:
  quest: INFO
  org.hibernate.SQL: WARN

---
# Local development against docker-compose PostgreSQL, fake auth, real LLM from .env
spring.config.activate.on-profile: local
quest.auth.fake: true
quest.cors-origins: "*"

---
# No PostgreSQL at hand: in-memory H2, fake auth, seeded lessons, no model calls unless LLM_PROVIDER is set
spring.config.activate.on-profile: h2
spring:
  datasource:
    url: jdbc:h2:mem:quest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
quest:
  auth.fake: true
  cors-origins: "*"
  llm.provider: ${LLM_PROVIDER:fake}
  seed.school: ${SEED_SCHOOL:true}
  pipeline.convert.allow-builtin-fallback: true

---
spring.config.activate.on-profile: test
spring:
  datasource:
    url: jdbc:h2:mem:questtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
quest:
  auth.fake: true
  auth.jwt-secret: test-secret-test-secret-test-secret-test-secret
  llm.provider: fake
  storage.local-dir: ${java.io.tmpdir}/quest-test-files
  admin.seed-email: admin@test.local
  admin.seed-password: admin1234
  pipeline.convert.allow-builtin-fallback: true
  # No background sweep under test. It ticks on a 60-second timer against the SessionFactory the whole suite shares,
  # so a tick that lands inside a `statements()` measurement makes the query-count tests off by one, and it reaches
  # into lessons another context seeded in the same H2 database. `StuckLessonTest` calls `sweep()` outright, which is
  # what that test is for and is unaffected by this switch.
  pipeline.watchdog.enabled: false

---
# QA on Cloud Run (project homework-quest-qa, branch develop): same wiring as prod, verbose logs, seeded sample lessons
spring.config.activate.on-profile: qa
spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:quest}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
quest:
  auth.fake: false
  storage.kind: gcs
  seed.school: ${SEED_SCHOOL:true}
logging.level:
  quest: DEBUG

---
# Production on Cloud Run (project homework-quest-prod, branch main): Cloud SQL socket factory, GCS, Firebase, Secret Manager env
spring.config.activate.on-profile: prod
spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:quest}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
quest:
  auth.fake: false
  storage.kind: gcs

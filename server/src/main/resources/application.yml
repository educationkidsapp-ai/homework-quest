spring:
  application.name: homework-quest
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:quest}}
    username: ${DB_USER:quest}
    password: ${DB_PASSWORD:quest}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: 25MB
    max-request-size: 120MB
  task.execution.pool:
    core-size: 2
    max-size: 4
    queue-capacity: 50

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression.enabled: true

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

quest:
  version: ${APP_VERSION:dev}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  panel-dir: ${PANEL_DIR:}   # admin panel bundle served at /panel/ (the Docker image sets it)
  cors-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:5173}
  auth:
    fake: ${FAKE_AUTH:false}
    firebase-credentials: ${FIREBASE_CREDENTIALS:}
    jwt-secret: ${ADMIN_JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
    jwt-hours: 12
  llm:
    provider: ${LLM_PROVIDER:deepseek}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5}
    max-tokens: 16000
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
    vision-model: ${DEEPSEEK_VISION_MODEL:deepseek-flash}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:16384}
  storage:
    kind: ${STORAGE_KIND:local}
    local-dir: ${STORAGE_DIR:data/files}
    gcs-bucket: ${GCS_BUCKET:}
  admin:
    seed-email: ${ADMIN_EMAIL:}
    seed-password: ${ADMIN_PASSWORD:}

logging.level:
  quest: INFO
  org.hibernate.SQL: WARN

---
# Local development against docker-compose PostgreSQL, fake auth, real LLM from .env
spring.config.activate.on-profile: local
quest.auth.fake: true
quest.cors-origins: "*"

---
# No PostgreSQL at hand: in-memory H2, fake auth, seeded lessons, no model calls unless LLM_PROVIDER is set
spring.config.activate.on-profile: h2
spring:
  datasource:
    url: jdbc:h2:mem:quest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
quest:
  auth.fake: true
  cors-origins: "*"
  llm.provider: ${LLM_PROVIDER:fake}

---
spring.config.activate.on-profile: test
spring:
  datasource:
    url: jdbc:h2:mem:questtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  task.execution.pool.core-size: 1
quest:
  auth.fake: true
  auth.jwt-secret: test-secret-test-secret-test-secret-test-secret
  llm.provider: fake
  storage.local-dir: ${java.io.tmpdir}/quest-test-files
  admin.seed-email: admin@test.local
  admin.seed-password: admin1234

---
# QA on Cloud Run (project homework-quest-qa, branch develop): same wiring as prod, verbose logs, seeded sample lessons
spring.config.activate.on-profile: qa
spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:quest}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
quest:
  auth.fake: false
  storage.kind: gcs
logging.level:
  quest: DEBUG

---
# Production on Cloud Run (project homework-quest-prod, branch main): Cloud SQL socket factory, GCS, Firebase, Secret Manager env
spring.config.activate.on-profile: prod
spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:quest}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
quest:
  auth.fake: false
  storage.kind: gcs

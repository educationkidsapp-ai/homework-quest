org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true
# iOS: build the shared framework as static
kotlin.native.ignoreDisabledTargets=true
# App config
# Local default: the in-app fake API. An environment URL (-Pquest.qa.apiBaseUrl / -Pquest.prod.apiBaseUrl) always wins.
quest.useFakeApi=true
quest.apiBaseUrl=http://10.0.2.2:8080

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.jetbrains.compose.experimental.jscanvas.enabled=true

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# The build cache is what CI reads and writes (gradle/actions/setup-gradle: PRs read, `develop` writes).
org.gradle.caching=true
# Still off, and not for want of trying (P-CI): `:shared-ui:generateDesignTokens` and `:webAdmin:generateConfig` are
# ad-hoc tasks whose action closures capture the build script, which the configuration cache cannot serialize
# ("cannot serialize Gradle script object references"). Turning it on fails every build that touches either module.
# Fixing it means giving those two tasks a typed class (or `@Input` properties resolved at configuration time) in
# shared-ui/build.gradle.kts and webAdmin/build.gradle.kts, then flipping this to `true`.
org.gradle.configuration-cache=false
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true
# iOS: build the shared framework as static
kotlin.native.ignoreDisabledTargets=true
# App config
# Local default: the in-app fake API. An environment URL (-Pquest.qa.apiBaseUrl / -Pquest.prod.apiBaseUrl) always wins.
quest.useFakeApi=true
quest.apiBaseUrl=http://10.0.2.2:8080

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
